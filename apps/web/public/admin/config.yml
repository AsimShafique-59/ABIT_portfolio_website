backend:
  name: git-gateway
  branch: main

media_folder: "apps/web/public/clients"
public_folder: "/clients"

collections:
  - name: "company"
    label: "Company Info"
    files:
      - name: "company"
        label: "Company Details & Contact"
        file: "apps/web/content/company.json"
        fields:
          - label: "Company Name"
            name: "name"
            widget: "string"
          - label: "Address"
            name: "address"
            widget: "string"
          - label: "Phone (Belgium)"
            name: "phoneBelgium"
            widget: "string"
          - label: "Phone (Germany)"
            name: "phoneGermany"
            widget: "string"
          - label: "Email (Main)"
            name: "emailMain"
            widget: "string"
          - label: "Email (Support)"
            name: "emailSupport"
            widget: "string"
          - label: "Website"
            name: "website"
            widget: "string"

  - name: "testimonials"
    label: "Testimonials"
    files:
      - name: "testimonials"
        label: "Client Testimonials"
        file: "apps/web/content/testimonials.json"
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - label: "Quote"
                name: "quote"
                widget: "text"
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Role / Job Title"
                name: "role"
                widget: "string"
              - label: "Company"
                name: "company"
                widget: "string"

  - name: "clients"
    label: "Key Clients"
    files:
      - name: "clients"
        label: "Key Clients"
        file: "apps/web/content/clients.json"
        fields:
          - label: "Clients"
            name: "clients"
            widget: "list"
            fields:
              - label: "Company Name"
                name: "name"
                widget: "string"
              - label: "Sector"
                name: "sector"
                widget: "string"
              - label: "Logo Path"
                name: "logo"
                widget: "string"
                hint: "e.g. /clients/ikea.svg"

  - name: "services"
    label: "Services"
    files:
      - name: "services"
        label: "All Services"
        file: "apps/web/content/services.json"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "URL slug — do not change e.g. data-centre"
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Short Description"
                name: "shortDesc"
                widget: "text"
              - label: "Full Description"
                name: "fullDesc"
                widget: "text"
              - label: "Icon (emoji)"
                name: "icon"
                widget: "string"
              - label: "Features"
                name: "features"
                widget: "list"
              - label: "Use Cases"
                name: "useCases"
                widget: "list"
